<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#EAEEF1"/>
      <stop offset="100%" stop-color="#DDE4EA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 蓝图网格背景 -->
  <g stroke="rgba(15,42,68,.05)" stroke-width="1">
    <path d="M0 80 L1200 80 M0 160 L1200 160 M0 240 L1200 240 M0 320 L1200 320 M0 400 L1200 400 M0 480 L1200 480 M0 560 L1200 560"/>
    <path d="M120 0 L120 630 M240 0 L240 630 M360 0 L360 630 M480 0 L480 630 M600 0 L600 630 M720 0 L720 630 M840 0 L840 630 M960 0 L960 630 M1080 0 L1080 630"/>
  </g>

  <!-- 港口剪影 -->
  <g stroke="#0F2A44" stroke-width="3" fill="none" stroke-linecap="round">
    <g transform="translate(120,300)">
      <line x1="0" y1="0" x2="180" y2="0"/>
      <line x1="30" y1="0" x2="30" y2="160"/>
      <line x1="45" y1="0" x2="45" y2="160"/>
      <line x1="135" y1="0" x2="135" y2="160"/>
      <line x1="150" y1="0" x2="150" y2="160"/>
      <line x1="30" y1="0" x2="45" y2="160"/>
      <line x1="135" y1="0" x2="150" y2="160"/>
      <rect x="80" y="-8" width="24" height="12" fill="#BD6A3D" stroke="#0F2A44"/>
      <rect x="65" y="56" width="56" height="22" fill="#BD6A3D" stroke="#0F2A44"/>
    </g>
  </g>

  <!-- 集装箱排列 -->
  <g stroke="#0F2A44" stroke-width="2.5">
    <rect x="780" y="380" width="100" height="44" fill="#BD6A3D"/>
    <rect x="880" y="380" width="100" height="44" fill="#FFFFFF"/>
    <rect x="980" y="380" width="100" height="44" fill="#BD6A3D"/>
    <rect x="830" y="336" width="100" height="44" fill="#FFFFFF"/>
    <rect x="930" y="336" width="100" height="44" fill="#BD6A3D"/>
    <rect x="880" y="292" width="100" height="44" fill="#BD6A3D"/>
  </g>

  <!-- 标题 -->
  <text x="120" y="130" font-family="Noto Serif SC, serif" font-size="58" font-weight="500" fill="#0E1E2F">中国寄美英欧加，</text>
  <text x="120" y="200" font-family="Noto Serif SC, serif" font-size="58" font-weight="500" fill="#0E1E2F">找 <tspan fill="#BD6A3D">Anita</tspan> 就够了</text>

  <!-- 副标题 -->
  <text x="120" y="252" font-family="Newsreader, serif" font-style="italic" font-size="22" letter-spacing="6" fill="#BD6A3D">CHINA · US · UK · EU · CANADA</text>

  <!-- 标签条 -->
  <g font-family="Noto Sans SC, sans-serif" font-size="20" fill="#3D4F66">
    <rect x="120" y="500" width="160" height="48" rx="24" fill="#FFFFFF" stroke="#D2DAE3"/>
    <text x="200" y="531" text-anchor="middle">DDP 双清包税</text>
    <rect x="295" y="500" width="160" height="48" rx="24" fill="#FFFFFF" stroke="#D2DAE3"/>
    <text x="375" y="531" text-anchor="middle">海运 · 空运</text>
    <rect x="470" y="500" width="140" height="48" rx="24" fill="#FFFFFF" stroke="#D2DAE3"/>
    <text x="540" y="531" text-anchor="middle">门到门</text>
    <rect x="625" y="500" width="160" height="48" rx="24" fill="#FBE6D4" stroke="#F0C7A4"/>
    <text x="705" y="531" text-anchor="middle" fill="#9B5732">微信亲回</text>
  </g>

  <!-- 底部品牌条 -->
  <text x="120" y="600" font-family="Newsreader, serif" font-style="italic" font-size="18" fill="#7889A0">www.anitalogistics.com · 深圳自营仓</text>
</svg>
